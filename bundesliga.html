<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bundesliga</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&family=Roboto+Condensed:wght@400;700&family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --red: #d2001f;
        --dark: #0a0a0a;
        --dark2: #141414;
        --dark3: #1e1e1e;
        --dark4: #282828;
        --border: #2a2a2a;
        --text: #fff;
        --text-muted: #888;
        --text-dim: #555;
        --espn-red: #d2001f;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--dark);
        color: var(--text);
        font-family: 'Roboto', sans-serif;
      }

      /* ── Top bar ─────────────────────────────────────────────────────── */
      .top-bar {
        background: var(--dark2);
        border-bottom: 1px solid var(--border);
        padding: 0 16px;
        height: 48px;
        display: flex;
        align-items: center;
      }

      /* ── Main nav ────────────────────────────────────────────────────── */
      .main-nav {
        background: var(--dark3);
        border-bottom: 1px solid var(--border);
        padding: 0 16px;
        display: flex;
        align-items: center;
        gap: 4px;
        overflow-x: auto;
        height: 40px;
      }

      .nav-link {
        font-family: 'Roboto Condensed', sans-serif;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        text-decoration: none;
        color: var(--text);
        padding: 0 8px;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 100%;
      }

      .nav-link:hover {
        color: var(--red);
      }

      /* ── Main content area ───────────────────────────────────────────── */
      .main-content {
        padding: 16px;
      }

      /* ── Footer ──────────────────────────────────────────────────────── */
      .footer {
        background: var(--dark2);
        border-top: 1px solid var(--border);
        padding: 16px;
        color: var(--text-muted);
        font-size: 12px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!-- Top bar -->
    <header class="top-bar">
      <span style="font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 20px; color: var(--red);">
        BUNDESLIGA
      </span>
    </header>

    <!-- Main navigation -->
    <nav class="main-nav" aria-label="Hauptnavigation">
      <a href="/" class="nav-link">Home</a>
      <a href="/news" class="nav-link">News</a>
      <a href="/spielplan" class="nav-link">Spielplan</a>
      <a href="/tabelle" class="nav-link">Tabelle</a>
      <a href="/clubs" class="nav-link">Clubs</a>
      <a href="/liveticker" class="nav-link">Liveticker</a>
      <!-- Live Predict nav link — inserted immediately after Liveticker -->
      <!-- In the React app, this is rendered by NavLivePredictLink component -->
      <!-- which uses useMatch to detect the active route and show the LivePill -->
      <a href="/live-predict" class="nav-link" id="nav-live-predict">Live Predict</a>
      <a href="/history" class="nav-link">History</a>
      <a href="/videos" class="nav-link">Videos</a>
      <a href="/tickets" class="nav-link">Tickets</a>
      <a href="/statistiken" class="nav-link">Statistiken</a>
      <a href="/awards" class="nav-link">Awards</a>
      <a href="/spieler" class="nav-link">Spieler</a>
      <a href="/faq" class="nav-link">FAQ</a>
    </nav>

    <!-- Main content area — React app mounts here -->
    <main class="main-content" id="root"></main>

    <!-- Footer -->
    <footer class="footer">
      &copy; Bundesliga
    </footer>

    <!-- React app entry point -->
    <script type="module" src="/src/live-predict/main.tsx"></script>
  </body>
</html>
